; SilentDisco puck firmware: Seeed XIAO ESP32-S3 + PCM5102A, Snapcast client.
; Build and flash with PlatformIO (VS Code extension, or `pio run -t upload`).
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; XIAO ESP32-S3: 8 MB flash, 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_SNAPCLIENT_USE_MDNS=false       ; we do our own mDNS lookup so we also know the IP for JSON-RPC
    -DCONFIG_NVS_FLASH=false                 ; Preferences initialises NVS
    -DCONFIG_SNAPCAST_CLIENT_NAME='"SilentDisco Puck"'
    -DCONFIG_SNAPCAST_BUFF_LEN=1024

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libopus.git
    https://github.com/pschatzmann/arduino-snapclient.git
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.0

lib_ldf_mode = deep+
