# Snapcast server configuration for the SilentDisco party box.
# Installed to /etc/snapserver.conf by scripts/install.sh.
#
# Four colour channels, each fed by a FIFO that a looper service
# (systemd/silentdisco-channel@.service) keeps filled with 48 kHz
# 16-bit stereo PCM. Clients (phones in the browser, Android app,
# ESP32 pucks) pick a channel by joining its stream.

[server]
threads = -1
# user/group are set by the package's systemd unit, not here.

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
# Snapweb, the browser client. Path is where the official .deb puts it.
doc_root = /usr/share/snapserver/snapweb

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704

# Every channel uses the same format so a client can hop between them
# without renegotiating.
sampleformat = 48000:16:2

# flac is a good default for phones. The ESP32 clients can be built for
# flac or pcm; if a puck struggles, append &codec=pcm to its stream only.
codec = flac

# Milliseconds of audio buffered on the client before playback. Larger is
# more robust on busy Wi-Fi; 1000 is plenty for a house party.
buffer = 1000

# Four colour channels. The looper service creates each FIFO and writes PCM
# into it; snapserver only reads (mode=read), which also keeps it happy under
# the package's hardened systemd unit.
source = pipe:///var/lib/silentdisco/fifo/yellow?name=Yellow&mode=read
source = pipe:///var/lib/silentdisco/fifo/red?name=Red&mode=read
source = pipe:///var/lib/silentdisco/fifo/green?name=Green&mode=read
source = pipe:///var/lib/silentdisco/fifo/blue?name=Blue&mode=read

[logging]
sink = system
filter = *:info
